<style>
/* Concept : carnet de chantier. Bandeau violet, onglets, filtres en puces, saisie rapide au clavier. */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13111F; --surface:#1C1930; --ink:#ECEAF8; --muted:#A5A1C6; --line:#2F2B49;
  --accent:#9A8FF0; --accent-ink:#13111F; --accent-soft:#2B2650;
  --abri:#9A8FF0; --tgb:#3CC3B2; --qual:#E8A25C; --nonq:#8EA0CC; --c3:#E37DB0; --c4:#B7C95A;
  --good:#4CC38A; --warn:#E0B04A; --bad:#EF7B6E; --bad-soft:#3A1F24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13111F; --surface:#1C1930; --ink:#ECEAF8; --muted:#A5A1C6; --line:#2F2B49;
  --accent:#9A8FF0; --accent-ink:#13111F; --accent-soft:#2B2650;
  --abri:#9A8FF0; --tgb:#3CC3B2; --qual:#E8A25C; --nonq:#8EA0CC; --c3:#E37DB0; --c4:#B7C95A;

tr:last-child td{border-bottom:0}
tr.open>td{background:var(--accent-soft)}
tr.sub td{background:var(--bg);font-size:13px}

.bars{display:grid;gap:7px}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}

.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.empty{padding:22px;text-align:center;color:var(--muted)}
.banner{border:1px solid var(--warn);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner.ro{border-color:var(--line);color:var(--muted)}
.banner.err{border-color:var(--bad);background:var(--bad-soft);font-weight:600}
.stockhint{padding:9px 12px;border-radius:8px;background:var(--accent-soft);font-size:13px}
.stockhint.bad{background:var(--bad-soft);color:var(--bad)}
.stk3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stk3>div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0;color:var(--ink)}
.stk3 span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;overflow-wrap:anywhere}
.stk3 b{font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stk3 .ok b{color:var(--good)} .stk3 .warn b{color:var(--qual)} .stk3 .neg b{color:var(--bad)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:92vw}
#toast.on{opacity:1}
.sub{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.steps{display:grid;gap:14px}
.prog{height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
#projbar{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#projbar select{width:auto;max-width:260px;font-weight:600;min-height:34px;padding:5px 10px}
#projbar .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.55);min-height:34px;padding:5px 12px}
#projbar .btn:hover{background:rgba(255,255,255,.14)}
#projbar .pinfo{flex-basis:100%;font-size:12.5px;opacity:.9}
.tagl{display:flex;flex-wrap:wrap;gap:0;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ---------- mode autonome (téléphone) : base locale + export ---------- */
if(!window.claude){
  window.LOCAL=true;
  const mem={},meta={},subs=[];let idb=null,onChange=()=>{};
  const sk=k=>[k.slice(0,k.indexOf('/')),k.slice(k.indexOf('/')+1)];
  const snap=n=>({docs:Object.entries(mem[n]||{}).map(([id,d])=>({id,data:()=>d}))});
  const fire=n=>subs.filter(s=>s[0]===n).forEach(([_,cb])=>cb(snap(n)));
  const tx=fn=>new Promise(res=>{if(!idb)return res();try{const t=idb.transaction(['docs','meta'],'readwrite');fn(t.objectStore('docs'),t.objectStore('meta'));t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}});
  const ready=new Promise(res=>{try{const r=indexedDB.open('bdt-terrain',2);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('docs'))d.createObjectStore('docs');if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta')};
    r.onsuccess=()=>{idb=r.result;try{const t=idb.transaction(['docs','meta']);
      const c=t.objectStore('docs').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){const [n,id]=sk(cur.key);(mem[n]=mem[n]||{})[id]=cur.value;cur.continue()}};
      const c2=t.objectStore('meta').openCursor();c2.onsuccess=()=>{const cur=c2.result;if(cur){meta[cur.key]=cur.value;cur.continue()}};
      t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}};r.onerror=()=>res()}catch(e){res()}});
  let clock=0;const stamp=()=>{clock=Math.max(Date.now(),clock+1);return clock};
  const localDb={collection(name){const q={doc(id){const k=name+'/'+id;return {
      set:async d=>{await ready;if(window.__ro){const e=new Error('Lecture seule');e.code='permission-denied';throw e}const v=JSON.parse(JSON.stringify(d));(mem[name]=mem[name]||{})[id]=v;const m={m:stamp()};meta[k]=m;await tx((D,M)=>{D.put(v,k);M.put(m,k)});fire(name);onChange()},
      delete:async()=>{await ready;if(window.__ro){const e=new Error('Lecture seule');e.code='permission-denied';throw e}if(mem[name])delete mem[name][id];const m={m:stamp(),del:true};meta[k]=m;await tx((D,M)=>{D.delete(k);M.put(m,k)});fire(name);onChange()}}},
    limit(){return q},onSnapshot(cb){subs.push([name,cb]);ready.then(()=>cb(snap(name)));return()=>{}}};return q}};
  /* accès pour la synchronisation Google : chaque élément porte sa date de modification (m) ; une suppression laisse une trace (del) */
  window.LOCALDB={ready,
    dump(){const o={};Object.entries(mem).forEach(([n,ds])=>Object.entries(ds).forEach(([id,d])=>{const k=n+'/'+id;o[k]={m:(meta[k]&&!meta[k].del&&meta[k].m)||1,d}}));
      Object.entries(meta).forEach(([k,v])=>{if(v.del&&!o[k])o[k]={m:v.m,del:true}});return o},
    async apply(entries){const ns=new Set();
      Object.entries(entries).forEach(([k,e])=>{const [n,id]=sk(k);if(e.del){if(mem[n])delete mem[n][id];meta[k]={m:e.m,del:true}}else{(mem[n]=mem[n]||{})[id]=e.d;meta[k]={m:e.m}}clock=Math.max(clock,e.m||0);ns.add(n)});
      await tx((D,M)=>Object.entries(entries).forEach(([k,e])=>{e.del?D.delete(k):D.put(e.d,k);M.put(meta[k],k)}));ns.forEach(fire)},
    async replaceAll(entries){const ns=new Set(Object.keys(mem));Object.keys(mem).forEach(n=>{mem[n]={}});Object.keys(meta).forEach(k=>delete meta[k]);
      Object.entries(entries).forEach(([k,e])=>{const [n,id]=sk(k);meta[k]=e.del?{m:e.m,del:true}:{m:e.m};if(!e.del)(mem[n]=mem[n]||{})[id]=e.d;ns.add(n)});
      await tx((D,M)=>{D.clear();M.clear();Object.entries(entries).forEach(([k,e])=>{if(!e.del)D.put(e.d,k);M.put(meta[k],k)})});ns.forEach(fire)},
    count(){return Object.values(mem).reduce((s,d)=>s+Object.keys(d).length,0)},
    setOnChange(f){onChange=f}};
  const dlSave=async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:/\.csv$/i.test(filename)?'text/csv;charset=utf-8':'application/octet-stream'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return {status:'saved'}};
  window.claude={use:async n=>n==='db'?localDb:n==='user'?{can:()=>true}:n==='downloads'?{save:dlSave}:null};
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
const LIM=window.LOCAL?1e9:1000;
const EMB={"P":[],"PARAM":[],"UNITS":[]};
const BASE_P=EMB.P, BASE_D=EMB.PARAM, UNITS0=EMB.UNITS;
let P=[],PID={},DES=[],UNITS=[],UNITS_MO=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const fmt=v=>nf.format(v), fmt0=v=>nf0.format(v);
const fdate=d=>d?String(d).split('-').reverse().join('/'):'';
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const COLLS=['mo','sorties','livraisons','postes','designations','fournisseurs','lieux','projets','ouvrages','fournMO','quals','statuts'];
const S={can:true,db:null,dl:null,err:'',loaded:{},full:[]};
COLLS.forEach(c=>S[c]=[]);S.raw={};S.wps=[];S.unites=[];S.dbRaw=null;
const SCOPED=['mo','sorties','livraisons','postes','fournisseurs','lieux','projets','ouvrages','fournMO','quals','statuts'],PREF=['postes','fournisseurs','lieux','projets','ouvrages','fournMO','quals','statuts'];

  so:{date:today(),store:'',waybill:'',des:'',unite:'',ouvrage:'',lieu:'',projet:'',qte:''},soErr:'',
  li:{date:today(),bc:'',nom:'',projet:'',lieu:'',des:'',qte:'',unite:'',lines:[]},
  fs:'',fl:'',stq:'',stP:'',open:new Set(),imp:null};

const TABS=[['mo-dashboard','Main d’œuvre'],['materiel','Matériel'],['stock','Stock'],['|'],['saisie-mo','Saisir la main d’œuvre'],['saisie-sorties','Saisir une sortie'],['saisie-livraisons','Saisir une livraison'],['|'],['importer','Importer'],['listes','Listes'],['projet','Projet (enregistrer / vider)']];

/* ---------- utilitaires ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}
function digits(inp){const v=inp.value,c=v.replace(/[^0-9]/g,'');if(c!==v){inp.value=c;toast('Insérer uniquement les chiffres')}return c}
function uniq(a){return [...new Set(a)].filter(x=>x!==''&&x!=null)}
function sum(a,f){let s=0;for(const x of a)s+=f(x);return s}
function groupBy(a,k){const m=new Map();for(const x of a){const key=k(x);if(!m.has(key))m.set(key,[]);m.get(key).push(x)}return m}
function pass(set,v){return set.size===0||set.has(v)}
function num(v){if(typeof v==='number')return v;const s=String(v??'').replace(/\s/g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n}
const PAL=['var(--abri)','var(--tgb)','var(--c3)','var(--c4)','var(--qual)','var(--nonq)'];
function colF(f){const i=moFourn().indexOf(f);return PAL[(i<0?0:i)%PAL.length]}

/* ---------- données de référence (intégrées + ajoutées) ---------- */
function rebuildRef(){

  S.postes.forEach(d=>m.set(d.id,{id:d.id,f:d.f,poste:d.poste,lin:d.lin||'',u:d.u||'',max:+d.max||0,prix:+d.prix||0,q:d.q||'Non Qualifié',st:d.st||''}));
  const hidF=new Set(S.fournMO.filter(x=>x.hidden).map(x=>dkey(x.nom)));
  P=[...m.values()].filter(p=>!hidF.has(dkey(p.f)));PID={};P.forEach(p=>PID[p.id]=p);
  const dm=new Map();BASE_D.forEach(x=>dm.set(dkey(x.d),{d:x.d,c:x.c||'',u:x.u||''}));
  S.designations.forEach(x=>dm.set(dkey(x.d),{d:x.d,c:x.c||'',u:x.u||''}));
  DES=[...dm.values()].sort((a,b)=>a.d.localeCompare(b.d,'fr'));
  UNITS=unitList('mat');UNITS_MO=unitList('mo');
}
function moFourn(){const hid=new Set(S.fournMO.filter(x=>x.hidden).map(x=>dkey(x.nom)));
  const reg=S.fournMO.filter(x=>!x.hidden).map(x=>x.nom);return uniq(P.map(p=>p.f).concat(reg)).filter(n=>!hid.has(dkey(n)))}
async function showFournMO(nom){nom=String(nom||'').trim();if(!nom)return;const d=S.fournMO.find(x=>dkey(x.nom)===dkey(nom)&&x.hidden);if(d){try{await S.db.collection('fournMO').doc(slug(d.nom)).set({nom:d.nom,ts:Date.now()})}catch(e){}}}
function unitList(type){
  const reg=S.unites.filter(x=>x.type===type),hid=new Set(reg.filter(x=>x.hidden).map(x=>dkey(x.nom)));
  const base=type==='mo'?P.map(p=>p.u):UNITS0.map(u=>u.trim()).concat(DES.map(x=>x.u),S.sorties.map(r=>r.unite),S.livraisons.map(r=>r.unite));
  return uniq(reg.filter(x=>!x.hidden).map(x=>x.nom).concat(base.map(x=>String(x||'').trim()))).filter(n=>!hid.has(dkey(n))).sort((a,b)=>a.localeCompare(b,'fr'))}

  try{await S.dbRaw.collection('unites').doc(type+'_'+slug(nom)).set({nom,type,ts:Date.now()});return true}catch(e){toast('Ajout impossible : '+(e.message||e.code));return false}}
const DERIVED={fournisseurs:()=>S.livraisons.map(r=>r.nom),lieux:()=>S.sorties.map(r=>r.lieu).concat(S.livraisons.map(r=>r.lieu)),projets:()=>S.sorties.map(r=>r.projet).concat(S.livraisons.map(r=>r.projet)),ouvrages:()=>S.sorties.map(r=>r.ouvrage)};
function names(kind){const hid=new Set(S[kind].filter(x=>x.hidden).map(x=>dkey(x.nom)));return uniq(S[kind].filter(x=>!x.hidden).map(x=>x.nom).concat(DERIVED[kind]().map(x=>String(x||'').trim()))).filter(n=>!hid.has(dkey(n))||S[kind].some(x=>!x.hidden&&dkey(x.nom)===dkey(n))).sort((a,b)=>a.localeCompare(b,'fr'))}
function paramUnit(des){const k=dkey(des);const p=DES.find(x=>dkey(x.d)===k);return p?p.u:''}
const slug=s=>dkey(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||hash(s);

/* ---------- stock : livraisons moins sorties par projet, plus ancien lot d'abord ---------- */
function computeStock(){
  const lots=S.livraisons.filter(l=>l.des&&+l.qte>0).map(l=>({key:dkey(l.des),des:l.des,unite:l.unite||'',projet:l.projet||NOPROJ,nom:l.nom||'',bc:l.bc||l.prf||'',date:l.date||'',ts:l.ts||0,qte:+l.qte,rest:+l.qte}))
    .sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
  const out=new Map();
  S.sorties.filter(r=>r.projet&&+r.qte>0).forEach(r=>{const k=dkey(r.des)+'|'+r.projet;out.set(k,(out.get(k)||0)+ +r.qte)});
  const art=new Map(),legacy=S.sorties.filter(r=>!r.projet).length;
  const byKP=groupBy(lots,l=>l.key+'|'+l.projet);
  for(const [kp,arr] of byKP){
    let need=out.get(kp)||0;
    for(const l of arr){const take=Math.min(l.rest,need);l.rest-=take;need-=take}
    const over=need; // sorties au-delà des livraisons
    const f=arr[0];
    if(!art.has(f.key))art.set(f.key,{key:f.key,des:f.des,unite:f.unite,proj:{},lots:[]});
    const a=art.get(f.key);a.proj[f.projet]=sum(arr,l=>l.rest)-over;a.lots.push(...arr);
  }
  const projets=uniq([...art.values()].flatMap(a=>Object.keys(a.proj))).sort();
  art.forEach(a=>{a.total=sum(Object.values(a.proj),v=>v)});
  return {art,projets,legacy,lots};
}
function availFor(st,des,projet){const a=st.art.get(dkey(des));return a&&a.proj[projet]!=null?a.proj[projet]:null}

/* ---------- calculs main d'œuvre ---------- */
function usedMap(){const m={};for(const e of S.mo)m[e.p]=(m[e.p]||0)+(+e.hj||0);return m}
function statut(max,used){return used>max?'DEPASSE':used===max&&max>0?'FINIE':'Encours'}
/* qualifications et statuts modifiables (onglet Listes) */
const QDEF=['Qualifié','Non Qualifié'];
function qualList(){const hid=new Set(S.quals.filter(x=>x.hidden).map(x=>dkey(x.nom))),r=new Map();QDEF.forEach((q,i)=>r.set(dkey(q),{n:q,k:i}));
  S.quals.filter(x=>!x.hidden).sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach((x,i)=>{if(!r.has(dkey(x.nom)))r.set(dkey(x.nom),{n:x.nom,k:x.rk!=null?+x.rk:100+i})});
  return [...r.values()].filter(o=>!hid.has(dkey(o.n))).sort((a,b)=>a.k-b.k).map(o=>o.n)}
function qualsUsed(){const ql=qualList();return uniq(ql.concat(P.map(p=>p.q))).filter(q=>ql.includes(q)||P.some(p=>p.q===q))}
const STD={Encours:'En cours',FINIE:'FINIE',DEPASSE:'DÉPASSÉ'};
function stLabel(k){const d=S.statuts.find(x=>x.auto===k);return (d&&d.nom)||STD[k]||k}
function manualStatuts(){const hid=new Set(S.statuts.filter(x=>!x.auto&&x.hidden).map(x=>dkey(x.nom)));return uniq(S.statuts.filter(x=>!x.auto&&!x.hidden).map(x=>x.nom)).filter(n=>!hid.has(dkey(n)))}
function pKeySt(p,u){if(p.st){const m=manualStatuts().find(n=>dkey(n)===dkey(p.st));if(m)return 'M:'+m}return statut(p.max,u)}
const stName=k=>k.startsWith('M:')?k.slice(2):stLabel(k);
const stCls=k=>k.startsWith('M:')?'Manuel':k;
const pStatut=(p,u)=>stName(pKeySt(p,u));
function moRows(){
  const um=usedMap(),out=[];
  for(const e of S.mo){const p=PID[e.p];if(!p)continue;
    out.push({f:p.f,q:p.q,poste:p.poste,lin:p.lin||'(sans code)',s:pStatut(p,um[p.id]||0),date:e.date,m:(e.date||'').slice(0,7),hj:+e.hj||0,cout:(+e.hj||0)*p.prix,pid:p.id})}
  return out}
function moFiltered(){const F=FQ.mo;return moRows().filter(r=>pass(F.f,r.f)&&pass(F.q,r.q)&&pass(F.s,r.s)&&pass(F.m,r.m)&&pass(F.l,r.lin))}

/* ---------- graphiques ---------- */
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),n=v/e;return (n<=1?1:n<=2?2:n<=5?5:10)*e}
function colChart(labels,series,fm){
  const W=640,H=230,L=48,R=8,T=10,B=34,n=labels.length;
  if(!n)return '<div class="empty">Aucune donnée pour ces filtres</div>';
  const tot=labels.map((_,i)=>sum(series,s=>s.vals[i]||0));
  const mx=niceMax(Math.max(...tot)),pw=(W-L-R)/n,bw=Math.min(46,pw*.68);
  let g='';
  for(let k=0;k<=4;k++){const v=mx*k/4,y=T+(H-T-B)*(1-k/4);g+=`<line class="g" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fm(v)}</text>`}
  const step=Math.ceil(n/12);
  labels.forEach((lb,i)=>{
    let y0=H-B;const x=L+pw*i+(pw-bw)/2;
    series.forEach(s=>{const v=s.vals[i]||0;if(v<=0)return;const h=(H-T-B)*v/mx;y0-=h;
      g+=`<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="2" fill="${s.color}"><title>${esc(lb)} · ${esc(s.name)} : ${fm(v)}</title></rect>`});
    if(i%step===0)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-B+15}" text-anchor="middle">${esc(lb)}</text>`});
  const lg=series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>${lg}`}
function hbars(items,fm,color){
  if(!items.length)return '<div class="empty">Aucune donnée pour ces filtres</div>';
  const mx=Math.max(...items.map(i=>i.v))||1;
  return `<div class="bars">${items.map(i=>`<div class="bar"><div class="lab" title="${esc(i.l)}">${esc(i.l)}</div><div class="tr"><div class="fi" style="width:${(100*i.v/mx).toFixed(1)}%;background:${i.c||color||'var(--accent)'}"></div></div><div class="vl">${fm(i.v)}</div></div>`).join('')}</div>`}
function donut(items,fm){
  const tot=sum(items,i=>i.v);if(tot<=0)return '<div class="empty">Aucune donnée pour ces filtres</div>';
  const R=60,C=2*Math.PI*R;let off=0,arcs='';
  items.forEach(i=>{const d=C*i.v/tot;arcs+=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${i.c}" stroke-width="26" stroke-dasharray="${d.toFixed(2)} ${(C-d).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 80 80)"><title>${esc(i.l)} : ${fm(i.v)}</title></circle>`;off+=d});
  return `<div class="donutwrap"><svg viewBox="0 0 160 160" width="160" height="160" role="img">${arcs}<text x="80" y="84" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--ink)">${fm(tot)}</text></svg><div class="legend" style="flex-direction:column;gap:6px;margin:0">${items.map(i=>`<span><i style="background:${i.c}"></i>${esc(i.l)} · ${fm(i.v)} (${Math.round(100*i.v/tot)} %)</span>`).join('')}</div></div>`}
const QPAL=['var(--qual)','var(--nonq)','var(--c3)','var(--c4)','var(--tgb)','var(--abri)'];
const colq=q=>{const i=qualsUsed().indexOf(q);return i<0?'var(--accent)':QPAL[i%QPAL.length]};

/* ---------- filtres (segments) ---------- */
function chips(group,key,label,opts){
  if(!opts.length)return '';
  return `<div class="fg"><span class="fl">${label}</span>${opts.map(o=>`<button class="chip" data-g="${group}" data-k="${key}" data-v="${esc(o)}" aria-pressed="${FQ[group][key].has(o)}">${esc(o)}</button>`).join('')}</div>`}
function wireChips(root,cb){
  root.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const s=FQ[b.dataset.g][b.dataset.k],v=b.dataset.v;s.has(v)?s.delete(v):s.add(v);cb()});
  root.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{Object.values(FQ[b.dataset.reset]).forEach(s=>s.clear());cb()})}
function monthLabel(m){const [y,mo]=m.split('-');return ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][+mo-1]+' '+y}

function soHint(){
  const f=FORM.so,st=computeStock();
  if(!f.des)return {h:'<span>Choisis l’article et le projet : le stock disponible et ce qui restera s’affichent ici.</span>',bad:false};
  const a=st.art.get(dkey(f.des)),q=parseInt(f.qte,10)||0;
  if(!a)return {h:'<b>Aucune livraison enregistrée pour cet article.</b> Enregistre d’abord la livraison pour pouvoir le sortir.',bad:true};
  const u=a.unite||f.unite||'';
  const tot=Object.values(a.proj).reduce((x,y)=>x+y,0);
  const other=Object.entries(a.proj).filter(([p,v])=>p!==f.projet&&v>0).map(([p,v])=>esc(p)+' : '+fmt(v)+' '+esc(u)).join(' · ');
  if(!f.projet)return {h:`<b>Stock total, tous projets : ${fmt(tot)} ${esc(u)}.</b> Choisis le projet pour voir son stock.${other?'<div class="hint" style="margin-top:4px">Par projet : '+other+'</div>':''}`,bad:false};
  const av=availFor(st,f.des,f.projet);
  if(av==null)return {h:`<b>Aucune livraison de cet article sur le projet « ${esc(f.projet)} ».</b>${other?' Stock sur les autres projets : '+other+'.':''}`,bad:true};
  const rest=av-q,bad=q>av;
  const lots=a.lots.filter(l=>l.projet===f.projet&&l.rest>0);
  let more='';if(lots.length){const l=lots[0];more+=`Sera pris d’abord sur : ${esc(l.nom||'fournisseur ?')}${l.bc?', bon de commande '+esc(l.bc):''}. `}
  if(other)more+='Autres projets : '+other+'.';
  return {bad,h:`<div class="stk3"><div><span>En stock (${esc(f.projet)})</span><b>${fmt(av)} ${esc(u)}</b></div><div><span>Cette sortie</span><b>${q?'− '+fmt(q):'–'}</b></div><div class="${bad?'neg':rest===0&&q?'warn':'ok'}"><span>Restera</span><b>${bad?'insuffisant':fmt(rest)+' '+esc(u)}</b></div></div>
    ${bad?`<div style="margin-top:6px"><b>Il ne reste que ${fmt(av)} ${esc(u)} : la sortie sera refusée.</b></div>`:''}${more?`<div class="hint" style="margin-top:6px">${more}</div>`:''}`}}
function updHint(){const h=$('#sHint');if(!h)return;const x=soHint();h.innerHTML=x.h;h.className='stockhint'+(x.bad?' bad':'')}
function desOptsSo(){const st=computeStock(),pj=FORM.so.projet,known=new Set(DES.map(p=>dkey(p.d)));
  return DES.concat([...st.art.values()].filter(a=>!known.has(dkey(a.des))).map(a=>({d:a.des,u:a.unite}))).map(p=>{const a=st.art.get(dkey(p.d));let v=null;if(a)v=pj?(a.proj[pj]!=null?a.proj[pj]:null):Object.values(a.proj).reduce((x,y)=>x+y,0);
    const u=(a&&a.unite)||p.u||'';return `<option value="${esc(p.d)}" label="${v==null?'Pas de stock'+(pj?' sur ce projet':''):'Stock : '+fmt(v)+' '+esc(u)}">`}).join('')}

function wireSaisieSorties(root){
  const f=FORM.so;
  const clr=()=>{if(FORM.soErr){FORM.soErr='';const b=document.querySelector('.banner.err');if(b)b.remove()}};
  const bind=(id,k,dig)=>{const el=$(id);el.oninput=()=>{f[k]=dig?digits(el):el.value;clr();if(k==='des'){const u=paramUnit(f.des);if(u){f.unite=u;$('#sUni').value=u}}if(k==='des'||k==='qte')updHint()}};
  const sel=(id,k)=>{const el=$(id);el.onchange=()=>{f[k]=el.value;clr();updHint();if(k==='projet'){const d=$('#dlDes');if(d)d.innerHTML=desOptsSo()}}};
  $('#sDate').onchange=()=>{f.date=$('#sDate').value};
  bind('#sStore','store',true);bind('#sWay','waybill',true);bind('#sQte','qte',true);bind('#sDes','des');bind('#sUni','unite');
  sel('#sProj','projet');sel('#sOuv','ouvrage');sel('#sLieu','lieu');
  wireAdd(root,(id,nom)=>{const k={sProj:'projet',sOuv:'ouvrage',sLieu:'lieu'}[id];if(k)f[k]=nom});
  $('#sCancel').onclick=()=>{Object.assign(FORM.so,{date:today(),store:'',waybill:'',des:'',unite:'',ouvrage:'',lieu:'',projet:'',qte:''});FORM.soErr='';render()};
  $('#sSave').onclick=async()=>{
    if(!f.date){toast('Choisissez la date.');return}
    if(!f.projet){toast('Choisissez le projet qui supporte la sortie.');$('#sProj').focus();return}
    if(!f.des.trim()){toast('Choisissez la désignation.');$('#sDes').focus();return}
    const n=parseInt(f.qte,10);if(!n||n<=0){toast('Saisissez une quantité supérieure à 0.');$('#sQte').focus();return}
    const st=computeStock(),av=availFor(st,f.des,f.projet),art=st.art.get(dkey(f.des)),u=(art&&art.unite)||f.unite||'';
    if(av==null||n>av){
      FORM.soErr=av==null?`Sortie refusée : aucune livraison enregistrée pour « ${f.des.trim()} » sur le projet « ${f.projet} ».`:`Sortie refusée : sur cet item, il ne reste que ${fmt(av)} ${u} pour le projet « ${f.projet} » (demandé : ${fmt(n)}).`;
      render();window.scrollTo({top:0,behavior:'smooth'});return}
    try{
      if(!DES.some(x=>dkey(x.d)===dkey(f.des)))await S.db.collection('designations').doc('d'+hash(dkey(f.des))).set({d:f.des.trim(),c:'',u:f.unite||''});
      await S.db.collection('sorties').doc(newId()).set({date:f.date,store:f.store,waybill:f.waybill,des:f.des.trim(),unite:f.unite,ouvrage:f.ouvrage,qte:n,lieu:f.lieu,projet:f.projet,ts:Date.now()});

function wireSaisieLivraisons(root){
  const f=FORM.li;
  $('#lDate').onchange=()=>{f.date=$('#lDate').value};
  $('#lBc').oninput=()=>{f.bc=$('#lBc').value};
  [['#lNom','nom'],['#lProj','projet'],['#lLieu','lieu']].forEach(([id,k])=>{$(id).onchange=()=>{f[k]=$(id).value}});
  wireAdd(root,(id,nom)=>{const k={lNom:'nom',lProj:'projet',lLieu:'lieu'}[id];if(k)f[k]=nom});
  const des=$('#lDes');des.oninput=()=>{f.des=des.value;const u=paramUnit(f.des);if(u){f.unite=u;$('#lUni').value=u}};
  $('#lUni').oninput=()=>{f.unite=$('#lUni').value};
  const qt=$('#lQte');qt.oninput=()=>{f.qte=digits(qt)};qt.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#lAdd').click()}};
  $('#lAdd').onclick=()=>{
    if(!f.des.trim()){toast('Choisissez la désignation.');des.focus();return}
    const n=parseInt(f.qte,10);if(!n||n<=0){toast('Saisissez une quantité supérieure à 0.');qt.focus();return}
    f.lines.push({des:f.des.trim(),qte:n,unite:f.unite});f.des='';f.qte='';f.unite='';render();$('#lDes').focus()};
  root.querySelectorAll('[data-lrm]').forEach(b=>b.onclick=()=>{f.lines.splice(+b.dataset.lrm,1);render()});
  $('#lCancel').onclick=()=>{Object.assign(FORM.li,{date:today(),bc:'',nom:'',projet:'',lieu:'',des:'',qte:'',unite:'',lines:[]});render()};
  $('#lSave').onclick=async()=>{
    if(!f.nom){toast('Choisissez le fournisseur.');$('#lNom').focus();return}
    if(!f.projet){toast('Choisissez le projet qui supporte le coût.');$('#lProj').focus();return}
    const items=f.lines.slice();f.lines=[];
    try{for(const l of items){
        if(!DES.some(x=>dkey(x.d)===dkey(l.des)))await S.db.collection('designations').doc('d'+hash(dkey(l.des))).set({d:l.des,c:'',u:l.unite||''});

  $('#lExp').onclick=()=>exportCsv('livraisons.csv',['Date','Bon de commande','Fournisseur','Projet','Designation','Quantite','Unite','Lieu'],S.livraisons.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(r=>[r.date,r.bc||r.prf||'',r.nom,r.projet||'',r.des,r.qte,r.unite,r.lieu]))}

function wireListes(root){

    if(!items.length){toast('Aucun changement');return}Object.values(FQ.mo).forEach(x=>x.clear());const fail=await writeMany(items,()=>{});toast(fail?'Enregistrement incomplet':'Noms des statuts enregistrés')};

function parseCsv(t){
  t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'';
  const d=[';','\t',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===d){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows}
async function readSheets(file){
  const n=file.name.toLowerCase();
  if(/\.(csv|txt)$/.test(n))return {CSV:parseCsv(await file.text())};
  if(!window.XLSX)throw new Error('La lecture des fichiers Excel n’est pas disponible (connexion). Enregistrez le fichier en CSV et réessayez.');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const out={};
  wb.SheetNames.forEach(s=>{out[s]=XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,raw:true,defval:''})});return out}
function hn(s){return norm(s).replace(/[^a-z0-9]+/g,' ').trim()}
function autoMap(rows,type){
  const def=IMP[type];let best={score:-1,h:0,map:{}};
  for(let h=0;h<Math.min(rows.length,30);h++){
    const heads=(rows[h]||[]).map(hn),used=new Set(),map={};
    for(const pass2 of [0,1])for(const [k,,al] of def.fields){if(map[k]!=null)continue;
      for(const a of al){const j=heads.findIndex((x,i)=>!used.has(i)&&x&&(pass2?x.includes(a):x===a));if(j>=0){map[k]=j;used.add(j);break}}}
    const sc=Object.keys(map).length+(def.req.every(k=>map[k]!=null)?5:0);
    if(sc>best.score)best={score:sc,h,map}}
  return best}
function pDate(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+60000);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*86400000));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  const s=String(v||'').trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if(m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/)){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad(+m[2])+'-'+pad(+m[1])}
  return ''}
function normQual(v){const s=norm(v);if(!s.trim())return 'Non Qualifié';const ex=qualList().find(x=>dkey(x)===dkey(v));if(ex)return ex;if(/non|sans/.test(s))return 'Non Qualifié';if(/qualif/.test(s))return 'Qualifié';return String(v).trim()}
function buildRecs(){

  const g=(r,k)=>M[k]!=null?r[M[k]]:'';
  rows.forEach((r,i)=>{
    if(!r||r.every(x=>String(x??'').trim()===''))return;
    const T=k=>String(g(r,k)??'').trim();
    if(I.type==='postes'){
      const poste=T('poste'),f=T('f')||D.f||'';if(!poste){bad.push(i);return}
      if(!f){bad.push(i);return}
      const key=f.toLowerCase()+'|'+dkey(poste);if(seen.has(key)){bad.push(i);return}seen.add(key);
      const ex=P.find(p=>p.f.toLowerCase()+'|'+dkey(p.poste)===key);
      recs.push({c:'postes',id:ex?ex.id:'I'+hash(key),upd:!!ex,d:{f,lin:T('lin'),poste,q:normQual(T('q')),u:T('u'),max:num(g(r,'max')),prix:num(g(r,'prix')),ts:Date.now()},show:[f,T('lin'),poste,normQual(T('q')),T('u'),num(g(r,'max')),num(g(r,'prix'))]})}

      const d=T('d');if(!d){bad.push(i);return}const key=dkey(d);if(seen.has(key)){bad.push(i);return}seen.add(key);
      recs.push({c:'designations',id:'d'+hash(key),upd:DES.some(x=>dkey(x.d)===key),d:{d,c:T('c'),u:T('u')},show:[d,T('c'),T('u')]})}
    else if(I.type==='livraisons'){

      const dt=pDate(g(r,'date'))||D.date||today();
      const rec={date:dt,bc:T('bc')||D.bc||'',nom:T('nom')||D.nom||'',projet:T('projet')||D.projet||'',lieu:T('lieu')||D.lieu||'',des,qte:q,unite:T('unite')||paramUnit(des),ts:Date.now()+i};
      recs.push({c:'livraisons',id:newId(),d:rec,show:[fdate(rec.date),rec.bc,rec.nom,rec.projet,des,q,rec.unite]})}
    else{
      const des=T('des'),q=num(g(r,'qte')),dt=pDate(g(r,'date'));if(!des||q<=0||!dt){bad.push(i);return}
      const rec={date:dt,store:T('store'),waybill:T('waybill'),des,unite:T('unite')||paramUnit(des),ouvrage:T('ouvrage'),qte:q,lieu:T('lieu'),projet:T('projet')||D.projet||'',ts:Date.now()+i};

async function writeMany(items,onProg){
  let i=0,done=0,fail=0;
  const worker=async()=>{while(i<items.length){const it=items[i++];let tries=0;
    for(;;){try{const dc=S.db.collection(it.c).doc(it.id);if(it.del)await dc.delete();else await dc.set(it.d);break}
      catch(e){if((e.code==='resource_exhausted'||e.code==='unavailable')&&++tries<=5){await sleep(300*tries)}else{fail++;break}}}
    done++;onProg(done,items.length)}};
  await Promise.all([worker(),worker(),worker(),worker()]);return fail}

/* ---------- créer un projet depuis un fichier ---------- */
function parseSavedWb(wb){
  const isSaved=Object.values(PJ).some(([name])=>{const ws=wb.Sheets[name];if(!ws)return false;const r=XLSX.utils.sheet_to_json(ws,{header:1,defval:''})[0]||[];return String(r[0]).trim()==='id'});
  if(!isSaved)return null;
  const raw=[];Object.entries(PJ).forEach(([c,[name,cols]])=>{const ws=wb.Sheets[name];if(!ws)return;
    XLSX.utils.sheet_to_json(ws,{defval:''}).forEach(r=>{const id=String(r.id||'').trim().replace(/^[^~]*~/,'');if(!id)return;const d={};
      cols.forEach(k=>{let v=r[k];if(v===''||v==null)return;if(PJ_NUM.has(k))v=num(v);else if(k==='hidden')v=(v===true||/^(true|vrai|1)$/i.test(String(v)));else v=String(v);d[k]=v});
      raw.push({c,id,d})})});
  const meta={};const rs=wb.Sheets.Resume;if(rs)XLSX.utils.sheet_to_json(rs,{header:1,defval:''}).forEach(r=>{const k=String(r[0]).trim(),v=String(r[1]??'').trim();
    if(k==='Projet')meta.nom=v;if(k==='Bailleur(s)')meta.bailleurs=v.split(',').map(x=>x.trim()).filter(Boolean);if(k==='Codes de ligne')meta.lignes=v.split(',').map(x=>x.trim()).filter(Boolean)});
  return {raw,meta}}
function savedItems(raw){const out=raw.map(({c,id,d})=>{const x={...d};if(c==='mo'&&x.p){x.p=String(x.p).replace(/^[^~]*~/,'');if(WP!=='p0')x.p=WP+'~'+x.p}return {c,id,d:x}});
  /* les postes de départ intégrés à la page ne sont pas dans le fichier : on les recopie s'ils servent aux saisies */
  if(WP!=='p0'&&BASE_P.length){const have=new Set(raw.filter(x=>x.c==='postes').map(x=>x.id)),need=new Set(raw.filter(x=>x.c==='mo'&&x.d.p).map(x=>String(x.d.p).replace(/^[^~]*~/,'')));
    BASE_P.forEach(p=>{if(need.has(p.id)&&!have.has(p.id))out.push({c:'postes',id:p.id,d:{f:p.f,lin:p.lin||'',poste:p.poste,q:p.q,u:p.u||'',max:p.max,prix:p.prix,ts:Date.now()}})})}
  return out}
async function readProjectFile(fl){
  const nm=fl.name.toLowerCase();
  if(/\.xlsx?$/.test(nm)){
    if(!window.XLSX)throw new Error('La lecture des fichiers Excel n’est pas disponible (connexion). Réessaie avec internet.');
    const wb=XLSX.read(await fl.arrayBuffer(),{type:'array',cellDates:true});const sv=parseSavedWb(wb);
    if(sv){if(!sv.raw.length)throw new Error('Ce projet enregistré ne contient aucune donnée.');
      const cnt={};sv.raw.forEach(x=>{cnt[x.c]=(cnt[x.c]||0)+1});
      const LB={livraisons:'livraisons',sorties:'sorties',mo:'saisies de main d’œuvre',postes:'postes',designations:'désignations',fournisseurs:'fournisseurs',lieux:'lieux',projets:'projets',ouvrages:'ouvrages',fournMO:'fournisseurs MO'};
      return {kind:'saved',name:fl.name,raw:sv.raw,meta:sv.meta,n:sv.raw.length,mo:!!cnt.postes,fourn:uniq(sv.raw.filter(x=>x.c==='postes').map(x=>x.d.f).filter(Boolean)),
        sum:Object.entries(cnt).map(([c,k])=>k+' '+(LB[c]||c)).join(', ')}}}
  const sheets=await readSheets(fl);const names0=Object.keys(sheets).filter(k=>sheets[k].length);if(!names0.length)throw new Error('Le fichier est vide.');
  const sh=Object.fromEntries(names0.map(k=>[k,sheets[k]]));let best={type:'livraisons',sheet:names0[0],score:-1};
  const HINT={livraisons:/livr|recept|entree/,sorties:/sorti|consomm|sortie/,postes:/poste|main|oeuvre|mo\b/,designations:/design|article|catalog/};
  ['livraisons','sorties','postes','designations'].filter(t=>IMP[t]).forEach(t=>names0.forEach(k=>{const a=autoMap(sh[k],t);const sc=a.score+(HINT[t].test(norm(k+' '+fl.name))?3:0);if(sc>best.score)best={type:t,sheet:k,score:sc}}));
  return {kind:'prep',name:fl.name,sheets:sh,type:best.type,sheet:best.sheet,sum:names0.length+' feuille(s), type détecté : '+IMP[best.type].title+(names0.length>1?' (feuille « '+best.sheet+' »)':'')}}

async function saveProject(){
  if(!window.XLSX){toast('Excel indisponible (connexion). Réessayez.');return false}

  try{const wb=buildWorkbook();const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
    await S.dl.save({filename:'projet-'+slug(curWp().nom)+'-'+today()+'.xlsx',data:buf});return true}
  catch(e){if(e.code==='declined')toast('Téléchargement refusé : rien n’est vidé.');else toast('Enregistrement impossible : '+(e.message||e.code));return false}}

function wireProjet(root){
  const P2=FORM.pj;
  $('#pjSave').onclick=async()=>{if(await saveProject()){P2.msg='Projet enregistré : le fichier est téléchargé et le projet est conservé.';render();toast('Projet enregistré, rien n’est supprimé.')}};
  $('#pjSaveDel').onclick=async()=>{if(!(await saveProject()))return;
    FORM.pd={txt:'',saved:true,busy:false};render();window.scrollTo({top:0,behavior:'smooth'});toast('Fichier téléchargé. Confirmez la suppression du projet.')};
  const tx=$('#pjTxt');if(tx)tx.oninput=()=>{P2.txt=tx.value};
  const cl=$('#pjClear');if(cl)cl.onclick=async()=>{
    if(P2.txt.trim().toUpperCase()!=='VIDER'){toast('Écrivez VIDER pour confirmer.');tx.focus();return}

    const bar=$('#pjBar'),t2=$('#pjTxtP');

    P2.busy=false;P2.saved=false;P2.txt='';P2.msg=fail?fail+' élément(s) n’ont pas pu être supprimés. Recommencez.':'Base remise à zéro. Importez un nouveau fichier ou réimportez un projet enregistré.';render()};

    try{if(!window.XLSX)throw new Error('Lecture Excel indisponible (connexion).');
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const sv=parseSavedWb(wb);
      if(!sv)throw new Error('Ce fichier n’est pas un projet enregistré par cette page. Pour un Excel préparé, utilisez l’onglet Importer.');
      const items=savedItems(sv.raw);
      if(!items.length)throw new Error('Aucune donnée trouvée dans ce fichier.');
      P2.busy=true;render();const bar=$('#pjBar'),t2=$('#pjTxtP');
      const fail=await writeMany(items,(d,n)=>{if(bar)bar.style.width=(100*d/n)+'%';if(t2)t2.textContent=d+' / '+n+' lignes importées…'});
      P2.busy=false;P2.msg=fail?`${items.length-fail} importées, ${fail} en échec.`:`Projet réimporté : ${items.length} éléments.`}
    catch(er){P2.busy=false;P2.err=er.message||'Lecture impossible.'}
    render()}}

function exportSheets(){
  const out=[],st=computeStock(),um=usedMap(),W=curWp();
  out.push({name:'Resume',rows:[['Base de données terrain'],['Projet',W.nom],['Bailleur(s)',(W.bailleurs||[]).join(', ')],['Codes de ligne',(W.lignes||[]).join(', ')],['Synchronisé le',new Date().toLocaleString('fr-FR')]]});
  moFourn().forEach(fo=>{const ps=P.filter(p=>p.f===fo);if(!ps.length)return;
    const rows=[['Code','Code LIN','Poste','Qualification','Unité','Prévu','Consommé','Reste','Prix unitaire (USD)','Coût prévu (USD)','Coût consommé (USD)','Coût restant (USD)','Statut']];
    let a=0,b=0,c=0,d=0;
    ps.forEach(p=>{const u=um[p.id]||0;a+=p.max;b+=u;c+=p.max*p.prix;d+=u*p.prix;rows.push([p.id,p.lin||'',p.poste,p.q,p.u||'',p.max,u,p.max-u,p.prix,p.max*p.prix,u*p.prix,(p.max-u)*p.prix,pStatut(p,u)])});
    rows.push(['TOTAL','','','','',a,b,a-b,'',c,d,c-d,'']);out.push({name:fo.slice(0,60),rows})});
  const sr=[['Article','Unité','Projet','Quantité en stock']];[...st.art.values()].sort((x,y)=>x.des.localeCompare(y.des,'fr')).forEach(x=>Object.entries(x.proj).forEach(([p,v])=>sr.push([x.des,x.unite,p,v])));out.push({name:'Stock',rows:sr});
  out.push({name:'Lots',rows:[['Article','Projet','Fournisseur','Bon de commande','Date','Livré','Restant'],...st.lots.map(l=>[l.des,l.projet,l.nom,l.bc,l.date,l.qte,l.rest])]});
  out.push({name:'MainOeuvre_detail',rows:[['Date','Fournisseur','Qualification','Poste','Code LIN','Hommes-jours','Prix unitaire','Coût'],...S.mo.slice().sort((x,y)=>(x.date||'').localeCompare(y.date||'')).map(e=>{const p=PID[e.p]||{};return [e.date,e.f,p.q,p.poste,p.lin,e.hj,p.prix,(e.hj||0)*(p.prix||0)]})]});
  Object.entries(PJ).forEach(([c,[name,cols]])=>out.push({name:'data_'+name,rows:[['id','wp',...cols],...(S.raw[c]||[]).map(d=>[d.id,d.wp||'p0',...cols.map(k=>d[k]==null?'':d[k])])]}));
  ['unites','wprojets'].forEach(c=>out.push({name:'data_'+c,rows:[['id',...(c==='unites'?['nom','type','hidden','ts']:['nom','bailleurs','lignes','ts'])],...(c==='unites'?S.unites.map(d=>[d.id,d.nom,d.type,!!d.hidden,d.ts||'']):S.wps.map(d=>[d.id,d.nom,(d.bailleurs||[]).join(', '),(d.lignes||[]).join(', '),d.ts||'']))]}));
  out.forEach(s=>{s.rows=s.rows.map(r=>r.map(safeCell))});return out}
async function doSync(silent){
  if(SYNC.busy)return;if(!SYNC.url||!SYNC.key){if(!silent)toast('Renseignez l’adresse du script et le code secret.');return}
  SYNC.busy=true;SYNC.msg='Envoi en cours…';SYNC.ok=true;if(tab==='sync')render();
  try{
    const res=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:SYNC.key,sheets:exportSheets()}),redirect:'follow'});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error||'Réponse inattendue');
    SYNC.last=new Date().toLocaleString('fr-FR');SYNC.link=j.url||SYNC.link;SYNC.msg='Synchronisation réussie ('+j.count+' feuilles).';SYNC.ok=true;saveSync();if(!silent)toast('Synchronisation réussie')}
  catch(e){SYNC.ok=false;SYNC.msg=navigator.onLine===false?'Pas de connexion. Vos données restent sur le téléphone ; réessayez quand le réseau revient.':'Échec : '+(e.message||e)+'. Vérifiez l’adresse du script et le code secret.'}
  SYNC.busy=false;if(tab==='sync')render()}

const needScope=()=>(G.member||G.joinId)?SC_MEM:SC_OWN;
const tokOk=()=>!!G.tok&&Date.now()<G.exp&&G.scope===needScope();

function loadGsi(){return gsiP||(gsiP=new Promise((res,rej)=>{if(gReady())return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;

/* demande de jeton : appelée directement dans un clic (fenêtre Google) */
function gLogin(){return new Promise((res,rej)=>{
  if(!G.cid)return rej(new Error('NOCID'));
  if(!gReady()){loadGsi().catch(()=>{});return rej(new Error('Google se charge encore : réessaie dans 2 secondes.'))}
  const scope=needScope();
  const tc=google.accounts.oauth2.initTokenClient({client_id:G.cid,scope,login_hint:G.email||undefined,
    callback:async r=>{if(r.error)return rej(new Error(r.error_description||r.error));
      G.tok=r.access_token;G.scope=scope;G.exp=Date.now()+Math.max(60,(+r.expires_in||3600)-120)*1000;
      try{const u=await (await gfetch('https://openidconnect.googleapis.com/v1/userinfo')).json();
        if(u.email&&u.email!==G.email){if(!G.member){G.folderId='';G.dataId='';G.sheetId='';G.presId=''}G.email=u.email}}catch(e){}
      G.later=false;saveG();res()},
    error_callback:e=>rej(new Error(e&&e.type==='popup_closed'?'Connexion annulée.':e&&e.type==='popup_failed_to_open'?'La fenêtre Google est bloquée : autorise les fenêtres pop-up ou ouvre l’application dans Chrome.':(e&&e.message)||'Connexion impossible.'))});
  tc.requestAccessToken({prompt:(G.email&&G.scope===scope)?'':'consent'})})}
async function gfetch(url,opt={}){
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+G.tok}});
  if(r.status===401){G.tok='';G.exp=0;saveG();throw new Error('AUTH')}
  if(!r.ok){let t='';try{t=(await r.json()).error.message}catch(e){}const er=new Error('Google '+r.status+(t?' : '+t:''));er.status=r.status;throw er}
  return r}

async function gFind(kind){const q=encodeURIComponent(`appProperties has { key='bdt' and value='${kind}' } and trashed=false and 'me' in owners`);
  const j=await (await gfetch(`${DRV}?q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime%20desc&spaces=drive`)).json();return (j.files&&j.files[0]&&j.files[0].id)||''}
async function gCreate(meta){const j=await (await gfetch(DRV+'?fields=id',{method:'POST',headers:JH,body:JSON.stringify(meta)})).json();return j.id}
async function gUpload(obj){const body=JSON.stringify(obj);
  if(G.dataId){try{await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${G.dataId}?uploadType=media`,{method:'PATCH',headers:JH,body});return}catch(e){if(e.status!==404||G.member)throw e;G.dataId=''}}
  const meta={name:'Base de données terrain – données',mimeType:'application/json',parents:[G.folderId],appProperties:{bdt:'data'},description:'Données de l’application Base de données terrain. Ne pas modifier à la main.'};
  const b='bdt'+Date.now().toString(36);
  const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  const j=await (await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp})).json();
  G.dataId=j.id;saveG()}
async function gEnsureSheet(){
  if(!G.sheetId)G.sheetId=await gFind('sheet');
  if(!G.sheetId){G.sheetId=await gCreate({name:'Base de données terrain (rapport)',mimeType:'application/vnd.google-apps.spreadsheet',parents:[G.folderId],appProperties:{bdt:'sheet'}});saveG()}}
async function gReport(sheets){
  if(!G.sheetId)return;
  const base='https://sheets.googleapis.com/v4/spreadsheets/'+G.sheetId;
  const info=await (await gfetch(base+'?fields=sheets.properties(sheetId,title)')).json();
  const seen=new Set(),want=sheets.map(s=>{let n=String(s.name).replace(/[\[\]*?\/\\:]/g,' ').slice(0,95)||'Feuille',x=n,i=2;while(seen.has(x))x=n+' '+(i++);seen.add(x);return x});
  const ex=(info.sheets||[]).map(s=>s.properties),reqs=[];
  want.filter(n=>!ex.some(p=>p.title===n)).forEach(n=>reqs.push({addSheet:{properties:{title:n}}}));
  ex.filter(p=>!want.includes(p.title)).forEach(p=>reqs.push({deleteSheet:{sheetId:p.sheetId}}));
  if(reqs.length)await gfetch(base+':batchUpdate',{method:'POST',headers:JH,body:JSON.stringify({requests:reqs})});
  const q=n=>"'"+n.replace(/'/g,"''")+"'";
  await gfetch(base+'/values:batchClear',{method:'POST',headers:JH,body:JSON.stringify({ranges:want.map(q)})});
  const cell=v=>v==null?'':typeof v==='string'&&/^'[=+\-@]/.test(v)?v.slice(1):v;
  await gfetch(base+'/values:batchUpdate',{method:'POST',headers:JH,body:JSON.stringify({valueInputOption:'RAW',data:sheets.map((s,i)=>({range:q(want[i])+'!A1',values:s.rows.length?s.rows.map(r=>r.map(cell)):[['']]}))})})}
/* membre : vérifier l'accès et le rôle donnés par le propriétaire */
async function gCheckMember(){
  let f;try{f=await (await gfetch(`${DRV}/${G.dataId}?fields=id,owners(emailAddress,displayName),capabilities(canEdit)`)).json()}
  catch(e){if(e.status===404||e.status===403){const er=new Error('NOACCESS');throw er}throw e}
  G.owner=(f.owners&&f.owners[0]&&(f.owners[0].emailAddress||f.owners[0].displayName))||G.owner;
  const was=G.canEdit;G.canEdit=!!(f.capabilities&&f.capabilities.canEdit);applyRole();saveG();if(was!==G.canEdit)render()}
async function gSync(manual){
  if(G.busy)return;
  if(navigator.onLine===false){G.dirty=true;saveG();if(manual){G.ok=false;G.msg='Pas de connexion. Les données restent sur ce téléphone ; la synchronisation se fera quand le réseau revient.';gRefresh()}return}
  if(!tokOk())return;
  G.busy=true;G.ok=true;G.msg='Synchronisation en cours…';gRefresh();
  try{
    await LOCALDB.ready;
    /* rejoindre une base partagée */
    if(G.joinId){const prev={member:G.member,dataId:G.dataId,sheetId:G.sheetId,presId:G.presId,folderId:G.folderId};
      Object.assign(G,{member:true,dataId:G.joinId,sheetId:'',presId:'',folderId:'',joinId:''});
      try{await gCheckMember()}catch(e){Object.assign(G,prev);G.joinId='';saveG();applyRole();if(e.message==='NOACCESS')throw new Error('Cette base n’est pas partagée avec '+G.email+'. Demande au propriétaire de la partager avec cette adresse');throw e}
      G.last='';saveG();render()}
    if(G.member){try{await gCheckMember()}catch(e){if(e.message==='NOACCESS'){G.ok=false;G.msg='Ton accès à la base de '+(G.owner||'ce propriétaire')+' a été retiré. Les données restent affichées sur ce téléphone.';G.busy=false;G.canEdit=false;applyRole();saveG();render();return}throw e}}
    else{
      if(!G.folderId)G.folderId=await gFind('folder');
      if(!G.folderId)G.folderId=await gCreate({name:'Base de données terrain',mimeType:'application/vnd.google-apps.folder',appProperties:{bdt:'folder'}});
      if(!G.dataId)G.dataId=await gFind('data');saveG();
      try{await gEnsureSheet()}catch(e){if(e.message==='AUTH')throw e}
      try{if(!G.presId)G.presId=await gFind('presence');if(!G.presId){G.presId=await gCreate({name:'base-terrain-presence',mimeType:'application/json',parents:[G.folderId],appProperties:{bdt:'presence'},description:'Passages des personnes invitées. Ne pas modifier.'});saveG()}}catch(e){if(e.message==='AUTH')throw e}}
    let remote={docs:{}};
    if(G.dataId){try{remote=await (await gfetch(`${DRV}/${G.dataId}?alt=media`)).json()}catch(e){if(e.status===404&&!G.member)G.dataId='';else throw e}}
    const rd=(remote&&remote.docs)||{};if(G.member&&remote&&remote.sheetId)G.sheetId=remote.sheetId;if(G.member&&remote&&remote.presId)G.presId=remote.presId;
    let nIn=0,nOut=0;
    if(isRO()){
      /* observateur : le téléphone devient une copie exacte de la base */
      const loc=LOCALDB.dump();nIn=Object.keys(rd).filter(k=>!loc[k]||loc[k].m!==rd[k].m).length+Object.keys(loc).filter(k=>!rd[k]).length;
      if(nIn){window.__ro=false;try{await LOCALDB.replaceAll(rd)}finally{applyRole()}}
    }else{
      const loc=LOCALDB.dump(),merged={},toLocal={};
      new Set([...Object.keys(loc),...Object.keys(rd)]).forEach(k=>{const a=loc[k],b=rd[k];
        if(a&&(!b||a.m>b.m)){merged[k]=a;nOut++}else{merged[k]=b;if(!a||a.m<b.m)toLocal[k]=b}});
      nIn=Object.keys(toLocal).length;
      if(nIn)await LOCALDB.apply(toLocal);
      if(nOut||!G.dataId||(!G.member&&(remote.sheetId!==G.sheetId||(remote.presId||'')!==G.presId)))await gUpload({app:'bdt',v:1,saved:new Date().toISOString(),by:G.email,sheetId:G.member?(remote.sheetId||''):G.sheetId,presId:G.member?(remote.presId||''):G.presId,docs:merged});
    }
    G.dirty=false;G.last=new Date().toLocaleString('fr-FR');
    let rep='';
    if(!isRO()&&G.sheetId&&(nIn||nOut||!G.member)){try{await new Promise(r=>setTimeout(r,60));rebuildRef();await gReport(exportSheets())}catch(e){if(e.message==='AUTH')throw e;rep=' Le tableau Google Sheets n’a pas pu être mis à jour ('+e.message+').'}}
    G.ok=!rep;G.msg='Synchronisation réussie : '+nIn+' élément(s) reçu(s)'+(isRO()?'':', '+nOut+' envoyé(s)')+'.'+rep;
    if(manual)toast(nIn||nOut?'Synchronisé : '+nIn+' reçu(s)'+(isRO()?'':', '+nOut+' envoyé(s)'):'Synchronisé : tout est à jour');
    if(!G.member&&tab==='sync'&&G.perms===null)gPerms();
    pBeat();pPoll()}
  catch(e){G.ok=false;G.dirty=!isRO();
    G.msg=e.message==='AUTH'?'La session Google a expiré : appuie sur « Synchroniser maintenant » pour te reconnecter.':navigator.onLine===false?'Connexion perdue pendant la synchronisation. Rien n’est perdu : réessaie quand le réseau revient.':'Échec : '+e.message+'.'}
  G.busy=false;saveG();gRefresh()}
function gClick(){
  if(G.busy)return;
  if(!G.cid){location.hash='sync';toast('Il manque l’identifiant client Google (voir l’onglet Google Drive).');return}
  if(tokOk()){gSync(true);return}
  gLogin().then(()=>gSync(true)).catch(e=>{if(e.message==='NOCID')return;G.ok=false;G.msg=e.message;gRefresh();toast(e.message)})}
function gLogout(){try{if(G.tok&&gReady())google.accounts.oauth2.revoke(G.tok,()=>{})}catch(e){}
  Object.assign(G,{tok:'',exp:0,scope:'',email:'',perms:null,msg:'Déconnecté. Les données restent sur ce téléphone.',ok:true});
  if(!G.member)Object.assign(G,{folderId:'',dataId:'',sheetId:'',presId:'',last:''});PRES.online=[];saveG();render()}
async function gLeave(){
  if(!G.leaveArm){G.leaveArm=true;render();return}
  window.__ro=false;try{await LOCALDB.replaceAll({})}catch(e){}
  Object.assign(G,{member:false,owner:'',canEdit:true,dataId:'',sheetId:'',presId:'',folderId:'',last:'',dirty:false,leaveArm:false,joinId:'',tok:'',exp:0,scope:'',msg:'Tu as quitté la base partagée. Ce téléphone est vide.',ok:true});applyRole();saveG();render()}
/* ---- partage (propriétaire) ---- */
const ROLE_FR={reader:'Observateur',commenter:'Observateur',writer:'Éditeur',owner:'Propriétaire'};
async function gPerms(){
  if(G.member||!G.dataId||!tokOk())return;
  try{const j=await (await gfetch(`${DRV}/${G.dataId}/permissions?fields=permissions(id,emailAddress,role,type,displayName)`)).json();
    G.perms=(j.permissions||[]).filter(p=>p.role!=='owner'&&p.type==='user');
    if(G.presId&&G.perms.length){try{const pj=await (await gfetch(`${DRV}/${G.presId}/permissions?fields=permissions(emailAddress,role)`)).json();const have=new Set((pj.permissions||[]).filter(p=>p.role==='writer'||p.role==='owner').map(p=>(p.emailAddress||'').toLowerCase()));
      for(const p of G.perms){const e=(p.emailAddress||'').toLowerCase();if(e&&!have.has(e))try{await gShareFile(G.presId,e,'writer',false)}catch(er){}}}catch(er){}}}catch(e){G.perms=[];G.share.ok=false;G.share.msg='Liste des accès illisible : '+e.message}
  if(tab==='sync')render()}
async function gShareFile(fid,email,role,notify,msg){
  const u=`${DRV}/${fid}/permissions?sendNotificationEmail=${notify?'true':'false'}`+(notify&&msg?'&emailMessage='+encodeURIComponent(msg):'');
  return gfetch(u,{method:'POST',headers:JH,body:JSON.stringify({type:'user',role,emailAddress:email})})}
async function gSheetPerm(email,fid){fid=fid||G.sheetId;if(!fid)return null;try{const j=await (await gfetch(`${DRV}/${fid}/permissions?fields=permissions(id,emailAddress)`)).json();return (j.permissions||[]).find(p=>(p.emailAddress||'').toLowerCase()===email.toLowerCase())||null}catch(e){return null}}
async function gShare(){
  const sh=G.share,email=sh.email.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('Adresse e-mail invalide');return}
  if(!tokOk()){gClick();return}
  sh.busy=true;sh.msg='';render();
  try{if(!G.dataId)await gSync(false);
    const link=inviteLink();
    try{await gfetch(`${DRV}/${G.dataId}?fields=id`,{method:'PATCH',headers:JH,body:JSON.stringify({name:'Base de données terrain – données'})})}catch(e){}
    try{await gShareFile(G.dataId,email,sh.role,false)}catch(e){if(e.status===400||e.status===403)await gShareFile(G.dataId,email,sh.role,true,invText(email,sh.role));else throw e}
    if(G.sheetId)try{await gShareFile(G.sheetId,email,sh.role,false)}catch(e){}
    if(G.presId)try{await gShareFile(G.presId,email,'writer',false)}catch(e){}
    sh.ok=true;sh.msg='Accès donné à '+email+' ('+ROLE_FR[sh.role]+'). Envoie-lui maintenant l’invitation ci-dessous. N’oublie pas de l’ajouter comme utilisateur test dans la console Google.';sh.inv={email,role:sh.role};sh.email=''}
  catch(e){sh.ok=false;sh.msg='Partage impossible : '+e.message}
  sh.busy=false;await gPerms()}
async function gSetRole(pid,email,role){
  try{if(role==='remove'){await gfetch(`${DRV}/${G.dataId}/permissions/${pid}`,{method:'DELETE'});const sp=await gSheetPerm(email);if(sp)await gfetch(`${DRV}/${G.sheetId}/permissions/${sp.id}`,{method:'DELETE'});const pp=await gSheetPerm(email,G.presId);if(pp)await gfetch(`${DRV}/${G.presId}/permissions/${pp.id}`,{method:'DELETE'});toast('Accès retiré à '+email)}
    else{await gfetch(`${DRV}/${G.dataId}/permissions/${pid}`,{method:'PATCH',headers:JH,body:JSON.stringify({role})});const sp=await gSheetPerm(email);if(sp)await gfetch(`${DRV}/${G.sheetId}/permissions/${sp.id}`,{method:'PATCH',headers:JH,body:JSON.stringify({role})});toast(email+' : '+ROLE_FR[role])}}
  catch(e){toast('Modification impossible : '+e.message)}
  await gPerms()}
const inviteLink=()=>location.origin+location.pathname+'?base='+G.dataId;
const myName=()=>{let n='';try{n=localStorage.getItem('bdt-myname')||''}catch(e){}if(n)return n;const l=String(G.email||'').split('@')[0].replace(/[._-]+/g,' ').trim();return l?l.charAt(0).toUpperCase()+l.slice(1):'Un collègue'};
const invSubject=()=>'Accès à la Base de données terrain';
const invText=(email,role)=>`Bonjour,\n\n${myName()} t’invite à la Base de données terrain (${role==='writer'?'Éditeur : tu peux saisir et modifier':'Observateur : tu peux consulter'}).\n\nClique ici pour y accéder :\n${inviteLink()}\n\nConnecte-toi ensuite avec ton compte Google${email?' ('+email+')':''}.`;

let gT=null;
function gChanged(){if(isRO())return;G.dirty=true;saveG();clearTimeout(gT);gT=setTimeout(()=>{if(tokOk())gSync(false)},8000)}
if(window.LOCALDB){
  applyRole();
  LOCALDB.setOnChange(gChanged);

  setInterval(()=>{if(G.member&&tokOk()&&document.visibilityState==='visible')gSync(false)},120000);
  setTimeout(async()=>{await loadCfg();if(navigator.onLine!==false&&G.cid)loadGsi().catch(()=>{});

    ${G.msg?`<div class="banner ${G.ok?'':'err'}" style="margin-top:12px">${esc(G.msg)}</div>`:''}
    <p class="hint" style="margin:12px 0 0">${G.last?'Dernière synchronisation : '+esc(G.last)+'. ':''}${G.dirty&&on&&!isRO()?'Des modifications attendent d’être envoyées. ':''}${G.sheetId?`<a href="https://docs.google.com/spreadsheets/d/${esc(G.sheetId)}" target="_blank" rel="noopener">Ouvrir le tableau Google Sheets</a>`:''}</p>
    <p class="hint" style="margin:8px 0 0">La synchronisation se fait seule à l’ouverture, après chaque saisie et quand le réseau revient, tant que la session Google est active (environ une heure). Après, un appui sur « Synchroniser maintenant » suffit.</p></div>
  ${viewShare()}
  ${viewPresence()}
  ${G.member?'':`<details class="card"><summary style="cursor:pointer;font-weight:600">Ancienne méthode : script Google (envoi seulement)</summary><div style="margin-top:12px">${viewSyncOld()}</div></details>`}`}
function wireSync(root){
  const g=$('#gGo');if(g)g.onclick=gClick;const o=$('#gOut');if(o)o.onclick=gLogout;const lv=$('#gLeave');if(lv)lv.onclick=gLeave;
  const c=$('#gCidOk');if(c)c.onclick=()=>{const v=$('#gCid').value.trim();if(!/\.apps\.googleusercontent\.com$/.test(v)){toast('L’identifiant doit finir par .apps.googleusercontent.com');return}G.cid=v;saveG();loadGsi().catch(()=>{});render()};
  const m=$('#shMail');if(m){m.oninput=()=>{G.share.email=m.value};$('#shRole').onchange=e=>{G.share.role=e.target.value};$('#shGo').onclick=gShare;
    $('#shCopy').onclick=async()=>{try{await navigator.clipboard.writeText(inviteLink());toast('Lien copié')}catch(e){$('#shLink').select();toast('Sélectionne et copie le lien')}};
    root.querySelectorAll('[data-prole]').forEach(s=>s.onchange=()=>gSetRole(s.dataset.prole,s.dataset.pmail,s.value));
    root.querySelectorAll('[data-pinv]').forEach(b=>b.onclick=()=>{G.share.inv={email:b.dataset.pinv,role:b.dataset.prl};G.share.msg='';render();const p=$('#invpanel');if(p)p.scrollIntoView({behavior:'smooth',block:'center'})});
    const nm=$('#shName');if(nm)nm.onchange=()=>{try{localStorage.setItem('bdt-myname',nm.value.trim())}catch(e){}render()};
    const iv=G.share.inv;if(iv){const t=invText(iv.email,iv.role);
      $('#invCopy').onclick=async()=>{try{await navigator.clipboard.writeText(t);toast('Message copié')}catch(e){toast('Copie impossible')}};
      $('#invX').onclick=()=>{G.share.inv=null;render()};
      const sb=$('#invShare');if(sb)sb.onclick=async()=>{try{await navigator.share({title:invSubject(),text:t})}catch(e){}}}
    root.querySelectorAll('[data-prm]').forEach(b=>b.onclick=()=>{if(b.dataset.arm){gSetRole(b.dataset.prm,b.dataset.pmail,'remove')}else{b.dataset.arm='1';b.textContent='Confirmer'}});
    if(G.perms===null&&tokOk()&&!G._pl){G._pl=1;gPerms().finally(()=>{G._pl=0})}}
  if(document.querySelector('#syUrl'))wireSyncOld(root)}

/* ---- badge de connexion (en haut, sur tous les onglets) ---- */
function renderGBadge(){const el=$('#gbadge');if(!el||!window.LOCAL)return;
  const ok=tokOk(),on=!!G.email;let h='';
  if(!on)h=`<button class="gb-pill" id="gbBadge" title="Ouvrir l’onglet Google Drive"><span class="gb-dot"></span>Non connecté à Google</button>`;
  else{const who=esc(G.email)+(G.member?` · ${G.canEdit?'Éditeur':'Observateur'} de la base de ${esc(G.owner||'?')}`:'');
    h=ok?`<button class="gb-pill gb-on" id="gbBadge" title="Ouvrir l’onglet Google Drive"><span class="gb-dot"></span>Connecté : ${who}${G.busy?' · synchronisation…':''}</button>`
      :`<button class="gb-pill gb-exp" id="gbBadge" title="Appuie pour te reconnecter"><span class="gb-dot"></span>Session expirée (${who}) · appuie pour te reconnecter</button>`;
    if(G.sheetId)h+=`<a class="gb-pill" href="https://docs.google.com/spreadsheets/d/${esc(G.sheetId)}" target="_blank" rel="noopener">Ouvrir Google Sheets ↗</a>`;
    if(!G.member&&PRES.online.length)h+=`<button class="gb-pill" id="gbPres" title="${esc(PRES.online.map(o=>o.email).join(', '))}">${PRES.online.slice(0,5).map(o=>`<span class="gb-av" title="${esc(o.email)}">${esc(pIni(o.email))}</span>`).join('')}${PRES.online.length} en ligne</button>`}
  el.innerHTML=h;
  const b=$('#gbBadge');if(b)b.onclick=()=>{if(on&&!ok)gClick();else location.hash='sync'};
  const p=$('#gbPres');if(p)p.onclick=()=>{location.hash='sync';setTimeout(()=>{const c=$('#prescard');if(c)c.scrollIntoView({behavior:'smooth'})},150)}}
/* ---- présence des invités : chacun note ses passages dans un petit fichier partagé (propriétés du fichier, une par personne) ---- */
const PRES=(()=>{let h=[],m=null;try{h=JSON.parse(localStorage.getItem('bdt-pres-hist')||'[]')}catch(e){}try{m=JSON.parse(localStorage.getItem('bdt-pres-my')||'null')}catch(e){}return {online:[],hist:h,my:m,last:0}})();
const pIni=e=>{const n=String(e).split('@')[0].replace(/[^a-zA-Z]/g,'');return (n.slice(0,2)||'?').toUpperCase()};
const pKey=e=>'u_'+String(e).toLowerCase().replace(/[^a-z0-9._@-]/g,'_').slice(0,60);
function pEnc(role,ss,max){let v=role;for(const [s,d] of ss){const p=';'+Math.floor(s/1000).toString(36)+','+Math.round(d/1000).toString(36);if(new TextEncoder().encode(v+p).length>max)break;v+=p}return v}
function pDec(v){const [r,...ps]=String(v||'').split(';');return {role:r==='w'?'writer':'reader',ss:ps.map(x=>{const [a,b]=x.split(',');return [parseInt(a,36)*1000,(parseInt(b,36)||0)*1000]}).filter(x=>x[0]>0)}}
async function pBeat(){
  if(!G.member||!G.presId||!tokOk()||document.visibilityState!=='visible'||navigator.onLine===false)return;
  const now=Date.now();const my=PRES.my&&PRES.my.base===G.dataId&&PRES.my.email===G.email?PRES.my:{base:G.dataId,email:G.email,ss:[]};
  const cur=my.ss[0];if(cur&&now-(cur[0]+cur[1])<5*60000)cur[1]=now-cur[0];else my.ss.unshift([now,0]);
  my.ss=my.ss.slice(0,8);PRES.my=my;try{localStorage.setItem('bdt-pres-my',JSON.stringify(my))}catch(e){}
  const key=pKey(G.email);
  try{await gfetch(`${DRV}/${G.presId}?fields=id`,{method:'PATCH',headers:JH,body:JSON.stringify({appProperties:{[key]:pEnc(G.canEdit?'w':'r',my.ss,124-key.length)}})})}catch(e){}}
async function pPoll(){
  if(G.member||!G.presId||!tokOk()||navigator.onLine===false)return;
  try{const j=await (await gfetch(`${DRV}/${G.presId}?fields=appProperties`)).json();const ap=j.appProperties||{},now=Date.now(),on=[];
    Object.entries(ap).forEach(([k,v])=>{if(!k.startsWith('u_'))return;const email=k.slice(2),{role,ss}=pDec(v);
      ss.forEach(([s,d])=>{const x=PRES.hist.find(y=>y.e===email&&y.s===s);if(x){x.d=Math.max(x.d,d);x.r=role}else PRES.hist.push({e:email,s,d,r:role})});
      const c=ss[0];if(c&&now-(c[0]+c[1])<3*60000)on.push({email,role,since:c[0]})});
    PRES.hist.sort((a,b)=>b.s-a.s);PRES.hist=PRES.hist.slice(0,300);try{localStorage.setItem('bdt-pres-hist',JSON.stringify(PRES.hist))}catch(e){}
    const ch=JSON.stringify(on.map(o=>o.email))!==JSON.stringify(PRES.online.map(o=>o.email));PRES.online=on;PRES.last=now;renderGBadge();if(tab==='sync'&&ch)schedule();else if(tab==='sync'){const c=$('#prescard');if(c&&!c.contains(document.activeElement))c.outerHTML=viewPresence()}}catch(e){}}
const fmtDur=d=>d<60000?'moins d’1 min':d<3600000?Math.round(d/60000)+' min':Math.floor(d/3600000)+' h '+String(Math.round(d%3600000/60000)).padStart(2,'0');
function viewPresence(){
  if(G.member||!G.email||!G.dataId)return '';
  const on=PRES.online,h=PRES.hist.slice(0,50);
  return `<div class="card" id="prescard"><h2>Qui consulte ma base</h2>
    <p style="margin:0 0 10px">${on.length?'<b>En ligne maintenant :</b> '+on.map(o=>`<span class="pres-on">${esc(o.email)} (${ROLE_FR[o.role]})</span>`).join(' '):'Personne en ce moment.'}</p>
    ${h.length?`<div class="tablewrap"><table><thead><tr><th>Personne</th><th>Rôle</th><th>Arrivée</th><th>Durée</th></tr></thead><tbody>${h.map(x=>`<tr><td>${esc(x.e)}</td><td>${ROLE_FR[x.r]||''}</td><td>${new Date(x.s).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${fmtDur(x.d)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">Aucune visite enregistrée pour l’instant.</p>'}
    <p class="hint" style="margin:10px 0 0">Mis à jour chaque minute tant que l’application est ouverte et connectée (décalage d’une à deux minutes). Les visites faites pendant que ton application était fermée apparaissent à ta prochaine ouverture.</p></div>`}
setInterval(()=>{if(window.LOCALDB){pBeat();pPoll();renderGBadge()}},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){pBeat();pPoll()}});

/* ---------- export, suppression ---------- */
async function exportCsv(name,heads,rows){
  if(!S.dl){toast('Export indisponible dans cette vue.');return}
  const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const txt='﻿'+[heads,...rows].map(r=>r.map(q).join(';')).join('\r\n');
  try{await S.dl.save({filename:name,data:txt})}catch(e){if(e.code!=='declined')toast('Export impossible.')}}
let delArm=null;
function wireDeletes(root){
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const key=b.dataset.del;
    if(delArm!==key){delArm=key;root.querySelectorAll('[data-del]').forEach(x=>{x.textContent='Supprimer'});b.textContent='Confirmer';return}
    delArm=null;const [c,id]=key.split(':');
    try{await S.db.collection(c).doc(id).delete();toast('Ligne supprimée')}catch(e){toast('Suppression impossible')}})}

/* ---------- rendu ---------- */
const VIEWS={'mo-dashboard':viewMoDash,'materiel':viewMateriel,'stock':viewStock,'saisie-mo':viewSaisieMo,'saisie-sorties':viewSaisieSorties,'saisie-livraisons':viewSaisieLivraisons,'importer':viewImporter,'projet':viewProjet,'sync':viewSync,'listes':viewListes};
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(t=>t[0]==='|'?'<span class="sep"></span>':`<button role="tab" data-t="${t[0]}" aria-selected="${tab===t[0]}">${t[1]}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.t})}
let pend=false;
function allLoaded(){return COLLS.every(c=>S.loaded[c])&&S.loaded.wprojets&&S.loaded.unites}
function render(){
  const main=$('#main');const y=window.scrollY;
  if(S.err){main.innerHTML=`<div class="card empty">${esc(S.err)}</div>`;return}
  if(!allLoaded()){main.innerHTML='<div class="card empty" id="loadmsg">Chargement des données…</div>';return}
  rebuildRef();
  const full=S.full.length?`<div class="banner">Limite de 1 000 lignes atteinte pour : ${esc(S.full.join(', '))}. Les lignes au-delà ne sont pas lues. Exportez en CSV et archivez les anciennes.</div>`:'';
  renderProjBar();
  if(window.LOCAL)renderGBadge();
  main.innerHTML=full+(window.LOCAL?gBanner():'')+(FORM.pe?viewProjPanel():'')+(FORM.pd?viewDelPanel():'')+VIEWS[tab]();
  if(FORM.pe)wireProjPanel(main);
  if(FORM.pd)wireDelPanel(main);
  if(tab==='mo-dashboard'){wireChips(main,render);const l=$('#linSel');l.onchange=()=>{FQ.mo.l.clear();if(l.value)FQ.mo.l.add(l.value);render()}}
  if(tab==='materiel')wireChips(main,render);
  if(tab==='stock')wireStock(main);
  if(tab==='saisie-mo')wireSaisieMo(main);
  if(tab==='saisie-sorties')wireSaisieSorties(main);
  if(tab==='saisie-livraisons')wireSaisieLivraisons(main);
  if(tab==='importer')wireImporter(main);
  if(tab==='listes')wireListes(main);
  if(tab==='projet')wireProjet(main);
  if(tab==='sync')wireSync(main);
  if(window.LOCAL){wireGBanner();if(!S.can)main.querySelectorAll('.banner.ro').forEach(b=>{b.textContent='Lecture seule : tu es observateur de la base partagée par '+(G.owner||'le propriétaire')+'. Seul un éditeur peut saisir ou modifier.'})}
  wireDeletes(main);
  renderTabs();
  window.scrollTo(0,y)}
function schedule(){if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;const a=document.activeElement;
  if((FORM.pe||FORM.pd)&&a&&a.closest&&a.closest('#projpanel,#delpanel'))return;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&(tab.startsWith('saisie')||tab==='listes'||tab==='importer'||tab==='stock'||tab==='projet'||tab==='sync')&&a.id)return;
  if(FORM.imp&&FORM.imp.busy)return;render()})}
function route(){const h=location.hash.replace('#','');tab=VIEWS[h]?h:'mo-dashboard';renderTabs();render()}
window.addEventListener('hashchange',route);

/* ---------- données partagées ---------- */
async function boot(){
  renderTabs();route();
  const timer=setTimeout(()=>{if(!allLoaded()){const m=$('#loadmsg');if(m)m.textContent='Les données ne répondent pas encore. Vérifiez votre connexion ; la page se mettra à jour toute seule.'}},10000);
  let db=null;try{db=await claude.use('db')}catch(e){}
  if(!db){clearTimeout(timer);S.err='La base de données n’est pas disponible dans cette vue. Ouvrez la page depuis claude.ai en étant connecté.';render();return}
  S.dbRaw=db;
  S.db={collection(name){const c=db.collection(name);if(!SCOPED.includes(name))return c;
    return {doc(id){const full=PREF.includes(name)&&WP!=='p0'&&!id.startsWith(WP+'~')?WP+'~'+id:id;const dd=c.doc(full);return {set:d=>dd.set({...d,wp:WP}),delete:()=>dd.delete()}}}}};
  db.collection('unites').limit(500).onSnapshot(s=>{S.unites=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.unites=true;if(allLoaded())clearTimeout(timer);schedule()},e=>{S.err='Lecture des unités impossible ('+(e.code||'erreur')+').';render()});
  db.collection('wprojets').limit(200).onSnapshot(s=>{S.wps=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.wprojets=true;if(!wpList().some(w=>w.id===WP)){WP=wpList()[0].id;applyScope()}if(allLoaded())clearTimeout(timer);schedule()},e=>{S.err='Lecture des projets impossible ('+(e.code||'erreur')+').';render()});
  try{const u=await claude.use('user');if(u){const c=u.can('data.write');if(c===false)S.can=false}}catch(e){}
  if(window.LOCAL)applyRole();
  try{S.dl=await claude.use('downloads')}catch(e){}
  COLLS.forEach(name=>db.collection(name).limit(1000).onSnapshot(s=>{
    S.raw[name]=s.docs.map(d=>({id:d.id,...d.data()}));S[name]=scope(name);S.loaded[name]=true;
    S.full=S.full.filter(x=>x!==name);if(s.docs.length>=LIM)S.full.push(name);
    if(allLoaded())clearTimeout(timer);schedule()},e=>{S.err='Lecture des données impossible ('+(e.code||'erreur')+').';render()}))}
boot();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
